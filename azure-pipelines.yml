trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  azureServiceConnection: 'AZURE_SERVICE_CONNECTION'
  webAppName: 'aepw-api'
  buildConfiguration: 'Release'

stages:
- stage: Build
  displayName: 'Build Application'
  jobs:
  - job: BuildJob
    steps:
    # 1. Install .NET 10 SDK
    - task: UseDotNet@2
      displayName: 'Install .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.x'

    # 2. Restore dependencies
    - script: dotnet restore
      displayName: 'Restore NuGet Packages'

    # 3. Build the project
    - script: dotnet build --configuration $(buildConfiguration) --no-restore
      displayName: 'Build Application'

    # 4. Run tests (remove if no test projects)
    - script: dotnet test --configuration $(buildConfiguration) --no-build --verbosity normal
      displayName: 'Run Unit Tests'

    # 5. Publish the app to a folder
    - script: dotnet publish --configuration $(buildConfiguration) --no-build --output $(Build.ArtifactStagingDirectory)/publish
      displayName: 'Publish Application'

    # 6. Archive the published output
    - task: ArchiveFiles@2
      displayName: 'Zip Published Output'
      inputs:
        rootFolderOrFile: '$(Build.ArtifactStagingDirectory)/publish'
        includeRootFolder: false
        archiveType: 'zip'
        archiveFile: '$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip'
        replaceExistingArchive: true

    # 7. Publish artifact for Deploy stage
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Build Artifact'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'

- stage: Deploy
  displayName: 'Deploy to Azure'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWebApp
    environment: 'production'
    strategy:
      runOnce:
        deploy:
          steps:
          # 8. Download the artifact from Build stage
          - task: DownloadBuildArtifacts@0
            displayName: 'Download Build Artifact'
            inputs:
              buildType: 'current'
              downloadType: 'single'
              artifactName: 'drop'
              downloadPath: '$(System.ArtifactsDirectory)'

          # 9. Deploy to Azure App Service
          - task: AzureRmWebAppDeployment@4
            displayName: 'Deploy to Azure App Service'
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              appType: 'webApp'
              WebAppName: '$(webAppName)'
              package: '$(System.ArtifactsDirectory)/drop/$(Build.BuildId).zip'
              enableCustomDeployment: true
              DeploymentType: 'zipDeploy'
              TakeAppOfflineFlag: true